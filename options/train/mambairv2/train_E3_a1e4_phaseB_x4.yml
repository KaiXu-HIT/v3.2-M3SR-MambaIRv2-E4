# E3: local alpha only; all E0 data paths and test metrics are preserved.
name: E3_a1e4_phaseB_x4
model_type: E3LocalAlphaMambaIRv2Model
scale: 4
num_gpu: 1
manual_seed: 10
datasets:
  train:
    task: SR
    name: DIV2K-Train-RGBDepth
    type: RGBDepthPairedImageDataset
    dataroot_gt:
    - /home/BRAIN/xukai/datasets/M3SR/DIV2K/DIV2K_train_HR/DIV2K_train_HR
    dataroot_lq:
    - /home/BRAIN/xukai/datasets/M3SR/DIV2K/DIV2K_train_LR_bicubic_X4/DIV2K_train_LR_bicubic/X4
    dataroot_depth:
    - /home/BRAIN/xukai/datasets/M3SR/DIV2K-Depth/DIV2K_train_LR_depth_X4
    filename_tmpl: '{}x4'
    filename_tmpl_depth: '{}x4'
    depth_percentile_low: 0.02
    depth_percentile_high: 0.98
    depth_normalize_eps: 1.0e-06
    io_backend:
      type: disk
    gt_size: 192
    use_hflip: true
    use_rot: true
    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 2
    dataset_enlarge_ratio: 100
    prefetch_mode: null
  val:
    task: SR
    name: DIV2K-Valid-RGBDepth
    type: RGBDepthPairedImageDataset
    dataroot_gt:
    - /home/BRAIN/xukai/datasets/M3SR/DIV2K/DIV2K_valid_HR/DIV2K_valid_HR
    dataroot_lq:
    - /home/BRAIN/xukai/datasets/M3SR/DIV2K/DIV2K_valid_LR_bicubic_X4/DIV2K_valid_LR_bicubic/X4
    dataroot_depth:
    - /home/BRAIN/xukai/datasets/M3SR/DIV2K-Depth/DIV2K_valid_LR_depth_X4
    filename_tmpl: '{}x4'
    filename_tmpl_depth: '{}x4'
    depth_percentile_low: 0.02
    depth_percentile_high: 0.98
    depth_normalize_eps: 1.0e-06
    io_backend:
      type: disk
network_g:
  type: E3LocalAlphaMambaIRv2
  upscale: 4
  in_chans: 3
  img_size: 64
  img_range: 1.0
  embed_dim: 174
  d_state: 16
  depths:
  - 6
  - 6
  - 6
  - 6
  - 6
  - 6
  num_heads:
  - 6
  - 6
  - 6
  - 6
  - 6
  - 6
  window_size: 16
  inner_rank: 64
  num_tokens: 128
  convffn_kernel_size: 5
  mlp_ratio: 2.0
  upsampler: pixelshuffle
  resi_connection: 1conv
  alpha_max: 0.1
  alpha_init: 0.01
  projection_std: 0.001
  local_alpha_init: 0.0075
path:
  pretrain_network_g: experiments/E3_a1e4_phaseA_x4/models/net_g_30000.pth
  strict_load_g: true
  resume_state: null
  pretrain_kind: e3
  param_key_g: params
train:
  optim_g:
    type: Adam
    lr: 0.0001
    weight_decay: 0
    betas:
    - 0.9
    - 0.99
  scheduler:
    type: MultiStepLR
    milestones: []
    gamma: 1.0
  total_iter: 100000
  warmup_iter: -1
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
  phase: B
  rgb_lr: 1.0e-05
  lambda_a: 0.0001
val:
  val_freq: 5000.0
  save_img: false
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 4
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: true
logger:
  print_freq: 500
  save_checkpoint_freq: 5000.0
  use_tb_logger: true
  wandb:
    project: null
    resume_id: null
dist_params:
  backend: nccl
  port: 31504
